<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>{% block title %}UniReviews{% endblock %}</title>

        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- Global Header CSS -->
        <link href="{{ url_for('static', filename='css/header.css') }}" rel="stylesheet">

        <!-- Global Footer CSS -->
        <link href="{{ url_for('static', filename='css/footer.css') }}" rel="stylesheet">

        <!-- Workload CSS -->
         <link href="{{ url_for('static', filename='css/workload_display.css')}}" rel="stylesheet">
         
        <!-- Page-specific CSS -->
        {% block styles %}{% endblock %}
    </head>

    <body>

        {% include "partials/header.html" %}

        <main>
            {% block content %}{% endblock %}
        </main>

         <!-- Footer -->
        {% include "partials/footer.html" %}

        {% block scripts %}{% endblock %}

        {{ moment.include_moment() }}

        <!-- FLOATING ACTION BUTTONS -->
        <div class="fab-container">

            <a href="{{ url_for('main.create_review_page', unit_code=unit.code)}}"
            class="fab fab-review"
            title="Write Review">
                ⭐
            </a>

            <a href="{{ url_for('main.create_discussion_page', unit_code=unit.code) }}"
            class="fab fab-discussion"
            title="Start Discussion">
                💬
            </a>

            <a href="#"
            class="fab fab-project"
            title="Post Project">
                📁
            </a>

        </div>
    </body>
</html>
