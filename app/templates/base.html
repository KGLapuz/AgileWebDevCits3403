<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>{% block title %}UniReviews{% endblock %}</title>

        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- Global Header CSS -->
        <link href="{{ url_for('static', filename='css/header.css') }}" rel="stylesheet">

        <!-- Workload CSS -->
         <link href="{{ url_for('static', filename='css/workload_display.css')}}" rel="stylesheet">
         
        <!-- Page-specific CSS -->
        {% block styles %}{% endblock %}

        <!-- Bootstrap JS for flash messages -->
         <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </head>

    <body>

        {% include "partials/header.html" %}

        <main>
            {% block content %}{% endblock %}
        </main>

        {% block scripts %}{% endblock %}

        {{ moment.include_moment() }}

        <!-- FLOATING ACTION BUTTONS -->
        {% if unit %}
            <div class="fab-container">

                <a href="{{ url_for('main.create_review_page', unit_code=unit.code)}}"
                class="fab fab-review"
                title="Write Review">
                    ⭐
                </a>

                <a href="{{ url_for('main.create_discussion_page', unit_code=unit.code) }}"
                class="fab fab-discussion"
                title="Start Discussion">
                    💬
                </a>

                <a href="#"
                class="fab fab-project"
                title="Post Project">
                    📁
                </a>

            </div>
        {% endif%}
    </body>
</html>
