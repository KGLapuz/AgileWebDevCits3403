<div class="content-card review-card">

    <div class="review-main">

        <!-- LEFT SIDE -->
        <div class="review-content">

            <div class="review-meta">
                <span>{{ item.created_at.year }}</span>
                <span>•</span>
                <span>{{ item.author.username }}</span>
            </div>

            <p class="review-preview">
                {{ item.content[:600] }}...
            </p>

        </div>

        <!-- RIGHT SIDE -->
        <div class="review-stats">

            <!-- Rating -->
            <div class="review-stat">

                <span class="stat-label">
                    Rating
                </span>

                <div class="stat-inline">

                    <span class="stat-value">
                        {{ "%.1f"|format(item.rating) }}
                    </span>

                    <div class="review-stars">

                        {% for i in range(1, 6) %}

                            <span
                                class="star {% if item.rating >= i %}filled{% endif %}"
                            >
                                ⭐️
                            </span>

                        {% endfor %}

                    </div>

                </div>

            </div>

            <!-- Workload -->
            <div class="review-stat">
                {% from "macros/workload.html" import workload_display %}

                {{ workload_display(item.workload, size="sm") }}

            </div>
        </div>
    </div>
</div>
