<a
    class="content-card clickable"
    href="{{ url_for('main.project_detail', project_id=item.project_id) }}"
>

    <h3>{{ item.title }}</h3>

    <div class="card-meta">
        <span> {{ item.author.username }}</span>
        <span>• {{ moment(item.created_at).fromNow() }}</span>
    </div>

    <p>
        {{ item.description[:140] }}{% if item.description > 140 %}...{% endif%}
    </p>

</a>
