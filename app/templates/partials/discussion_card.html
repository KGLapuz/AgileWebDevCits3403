<a
    class="content-card clickable"
    href="{{ url_for('main.discussion_thread', discussion_id=item.discussion_id) }}"
>

    <div class="card-top">
        <h3>{{ item.title }}</h3>
    </div>

    <div class="card-meta">

        <span>
            Posted by 
            {% if item.author_id == current_user_id %}
                You
            {% else %}
                {{ item.author.username }}
            {% endif %}
        </span>

        <span>
            • {{ moment(item.created_at).fromNow() }}
        </span>

        <span>
            • {{ item.reply_count }} replies
        </span>

    </div>

    <p class="card-preview">
        {{ item.body[:120] }}...
    </p>

</a>
