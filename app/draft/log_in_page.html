<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>log in page</title>
    <link rel="stylesheet" href="../static/stylesheet.css">
</head>

<body class="login-body">
    <div class="content">
        <div class="greetings">
            <div class="logo-container">
                <div class="logo"></div>
            </div>
            <h2>UniReviews</h2>
            <p>Shares Your Experience</p>
        </div>
        <form class="login-container" action="{{url_for('login')}}" method="POST">
            <div class="credentials">
                <div class="email">
                    <p>Email</p>
                    <input type="text" name="email" placeholder="user@gmail.com" required/>
                </div>
                <div class="password">
                    <p>Password</p>
                    <input type="password" name="password" placeholder="••••••••" required/>
                </div>
            </div>
            <button type="submit">Sign in</button>
            <p class="signup-text">Don't Have an account? Sign up now</p>
        </form>
    </div>
</body>
</html>
