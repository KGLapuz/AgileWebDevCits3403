<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>log in page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{url_for('static',filename='log_in_page_stylesheet.css')}}" rel="stylesheet"/>
</head>

<body>
    <div class="content">
        <div class="greetings">
            <div class="logo-container">
                <div class="logo"></div>
            </div>
            <h2>UniReviews</h2>
            <p>Shares Your Experience</p>
        </div>
        <form class="login-container" action="{{url_for('login')}}" method="POST">
            <div class="credentials">
                <div class="email">
                    <p>Email</p>
                    <input type="text" name="email" placeholder="user@gmail.com" required/>
                </div>
                <div class="password">
                    <p>Password</p>
                    <input type="password" name="password" placeholder="••••••••" required/>
                </div>
            </div>
            <button type="submit">Sign in</button>
        </form>
        <p class="signup-popup" onclick="popupSignup()">Don't Have an account? Sign up now</p>
    </div>
    <div id="SignUpForm" class="modal">
        <div class="SignUpForm-content">
            <span class="close" onclick="closeSignUp()">&times;</span>
            <h2>Create Account</h2>
            
            <form class="SignUp-container">
            <div class="Credentials">
                <div class="UserName">
                    <p>Username</p>
                    <input type="text" name="UserName" placeholder="Username" required/>
                </div>
                <div class="Email">
                    <p>Email</p>
                    <input type="text" name="email" placeholder="user@gmail.com"/>
                </div>
                 <div class="password">
                    <p>Password</p>
                    <input type="password" name="password" placeholder="••••••••" required/>
                </div>
            </div>
            <button type="submit" class="signup-btn">Sign Up</button>
            </form>
        </div>
    </div>
    <script src="{{url_for('static',filename='log_in_page.js')}}"></script>
</body>
